<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Black on white: a fixed white tile carries its own contrast, so the mark
       stands out on any browser tab (light or dark) instead of matching it.
       The theme-responsive alternative is favicon-theme.svg — swap the
       <link rel="icon"> in index.html to interchange them. -->
  <rect width="32" height="32" rx="7" fill="#ffffff"/>
  <text x="16" y="23.5" text-anchor="middle"
        font-family="Iowan Old Style, Palatino Linotype, Palatino, Charter, Georgia, serif"
        font-size="24" font-weight="500" fill="#181b1c">t</text>
</svg>
