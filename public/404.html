<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nothing here — Typepaper</title>
    <!-- This file existing is load-bearing: it switches Cloudflare Pages out
         of SPA-fallback mode, so a missing asset returns a real 404 instead
         of index.html served as CSS/JS — which the edge cache then pins for
         a year (the launch-day outage). npm run verify asserts it ships. -->
    <link rel="stylesheet" href="/404.css" />
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>There's no page here.</h1>
      <p><a href="/">Back to the blank page</a></p>
    </main>
  </body>
</html>
